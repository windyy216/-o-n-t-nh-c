     st:{born:0,died:0,built:0,harvest:0,wed:0,cloth:0},cx:24,cy:26,boats:[],flock:{mode:'pen',who:null},wedding:null,shornDay:-9,savedAt:Date.now()};

function setObj(i,o){S.objs[i]=o;cache={}}
function setTile(i,p){const t=S.tiles[i];const ch=('t' in p&&p.t!==t.t)||('road' in p&&(p.road||0)!==(t.road||0))||('ax' in p);Object.assign(t,p);cache={};if(ch){groundSoon=true;dirtyT.add(i)}}
function walk(x,y){if(!inb(x,y))return false;const t=S.tiles[idx(x,y)];if(t.t==='water')return false;const o=S.objs[idx(x,y)];return !(o&&BLOCK[o.k])}

function clearWater(x,y,r){if(!waterAt(x,y))return false;for(const[dx,dy] of DIRS)if(!waterAt(x+dx*r,y+dy*r))return false;return true}
function waterLine(a,b){const d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.ceil(d/0.2);for(let k=0;k<=n;k++){const x=a[0]+(b[0]-a[0])*k/n,y=a[1]+(b[1]-a[1])*k/n;const da=Math.hypot(x-a[0],y-a[1]),db=Math.hypot(x-b[0],y-b[1]);if(da<0.8||db<0.8){if(!waterAt(x,y)&&da>0.35&&db>0.35)return false}else if(!clearWater(x,y,0.38))return false}return true}
function reach(){
  if(cache.reach) return cache.reach;

  for(const[dx,dy] of DIRS){const x=S.cx+dx,y=S.cy+dy;if(walk(x,y)&&!r[idx(x,y)]){r[idx(x,y)]=1;q.push(idx(x,y))}}
  while(q.length){const c=q.pop(),cx=ix(c),cy=iy(c);for(const[dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(!walk(nx,ny))continue;if(dx&&dy&&(!walk(cx+dx,cy)||!walk(cx,cy+dy)))continue;const n=idx(nx,ny);if(!r[n]){r[n]=1;q.push(n)}}}
  for(let i=0;i<N*N;i++){if(r[i]){t[i]=1;continue}const x=ix(i),y=iy(i);for(const[dx,dy] of DIRS)if(inb(x+dx,y+dy)&&r[idx(x+dx,y+dy)]){t[i]=1;break}}

  else for(let i=0;i<N*N;i++){const o=S.objs[i];if(o&&o.k===k)out.push(i)}

}

/* lạc chỗ không đường về (đứng dưới nước, bị cô lập): lội/bơi thẳng về bờ gần nhất có đường, không dịch chuyển */
function swimTo(v){const rc=reach().r;let best=-1,bd=1e9;for(let i=0;i<N*N;i++){if(!rc[i]||!walk(ix(i),iy(i))||S.tiles[i].t==='water')continue;const d=(ix(i)-v.x)**2+(iy(i)-v.y)**2;if(d<bd){bd=d;best=i}}if(best<0)return false;

const prevA=new Int32Array(N*N),Q=new Int32Array(N*N),gm=new Uint8Array(N*N);
function findPath(sx,sy,gx,gy){
  sx=clamp(Math.round(sx),0,N-1);sy=clamp(Math.round(sy),0,N-1);
  gm.fill(0);let any=false;
  if(walk(gx,gy)){gm[idx(gx,gy)]=1;any=true}
  else for(const[dx,dy] of DIRS)if(walk(gx+dx,gy+dy)){gm[idx(gx+dx,gy+dy)]=1;any=true}
  if(!any) return null;
  const s=idx(sx,sy); if(gm[s]) return [];
  prevA.fill(-1);prevA[s]=s;let h=0,t=0;Q[t++]=s;
  while(h<t){const c=Q[h++],cx=ix(c),cy=iy(c);
    for(const[dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(!walk(nx,ny))continue;if(dx&&dy&&(!walk(cx+dx,cy)||!walk(cx,cy+dy)))continue;const n=idx(nx,ny);if(prevA[n]!==-1)continue;prevA[n]=c;
      if(gm[n]){const p=[];let k=n;while(k!==s){p.push(xy(k));k=prevA[k]}return p.reverse()}Q[t++]=n}}
  return null;
}

/* ======================= TASKS & PLANS ======================= */
function setTask(v,t,tx,ty,dur,extra){
  const task=Object.assign({},extra||{},{t,tx,ty,dur,arrived:false,acc:0,path:[]});
  /* ra khỏi nhà qua cửa; về nhà thì đi tới tận cửa rồi mới vào */
  let gx=tx,gy=ty,D=null,pre=null,stay=false;
  if(v.inHome!=null){const H=v.inHome,o=S.objs[H];v.inHome=null;if(o&&o.k==='house'){if(task.home&&tx!=null&&idx(Math.round(tx),Math.round(ty))===H){stay=true;task.stay=1}else{const E=doorOf(H);if(E){v.x=E.pt[0];v.y=E.pt[1];pre=E.tile;v.fadeT=S.time;v.inside=false;v.sleeping=false}}}}
  if(tx!=null&&task.home&&!stay){const H=idx(Math.round(tx),Math.round(ty)),o=S.objs[H];if(o&&o.k==='house'){D=doorOf(H);if(D){gx=D.tile[0];gy=D.tile[1]}}}
  if(tx!=null&&!stay){
    const p=findPath(pre?pre[0]:v.x,pre?pre[1]:v.y,gx,gy);if(p&&pre)p.unshift(pre);
    if(!p){v.plan=[];if(v.onBoat==null&&!v.inside&&!reach().r[idx(clamp(Math.round(v.x),0,N-1),clamp(Math.round(v.y),0,N-1))]&&swimTo(v))return false;v.failN=(v.failN||0)+1;v.task={t:'idle',dur:20*Math.min(6,v.failN),arrived:false,acc:0,path:[]};return false}
    v.failN=0;
    const last=p.length?p[p.length-1]:[Math.round(v.x),Math.round(v.y)];
    if(task.ring){const a=Math.atan2(last[1]-ty,last[0]-tx)+(R()-.5)*1.4;p.push([tx+Math.cos(a)*task.ring,ty+Math.sin(a)*task.ring])}
    else if(task.off) p.push([tx+task.off[0],ty+task.off[1]]);
    else if(task.jit) p.push([last[0]+(R()-.5)*.6,last[1]+(R()-.5)*.6]);
    if(D)p.push(D.pt);
    task.path=p;
  }
  if(!fast&&tx!=null&&INTENT[t]&&v.age>=4&&R()<0.12&&!saying(v))say(v,pick(INTENT[t]),28);
  v.task=task; return true;
}
function startStep(v,s){const at=s.at||null;return setTask(v,s.t,at?at[0]:null,at?at[1]:null,s.dur||0,s)}

function isSleep(v,h){const f=isFest(),o=((v.id*7)%10)*0.06;return v.age<14?(h>=(f?22:20.5)+o||h<6.3+o):(h>=(f?23:21.3)+o||h<5.5+o)}
function workHour(h){return (h>=7.5&&h<11.5)||(h>=13&&h<16.5)}
function chooseTask(v){
  const h=hourF(),kid=v.age<14,elder=v.age>=60,worker=!kid&&!elder;
  v.inside=false;v.sleeping=false;v.plan=[];
  if(v.sick){if(S.time>v.sick){v.sick=0;diary(v,'Đã khỏi ốm.');say(v,'Khỏe lại rồi!');log(nameOf(v)+' đã khỏi ốm.')}else{const ht=homeTile(v);if(ht)return setTask(v,'sickbed',ht[0],ht[1],60,{home:1});return setTask(v,'rest',S.cx,S.cy,60,{ring:1.4})}}
  if(isSleep(v,h)){const ht=homeTile(v);if(ht)return setTask(v,'sleep',ht[0],ht[1],1e9,{home:1});return setTask(v,'sleep',S.cx,S.cy,1e9,{ring:1.3})}
  if(v.carry){const r=deliverPlan(v);if(r!==null)return r}
  if(worker&&v.job==='shepherd'&&S.flock.mode!=='pen'){const r=shepherdTask(v,h);if(r)return r}
  const ht=homeTile(v),fed=S.time-v.lastMeal<180;
  if(h>=6&&h<7.5&&v.hunger>22&&!fed&&ht) return setTask(v,'eat',ht[0],ht[1],25,{home:1});
  if(h>=11.5&&h<13&&v.hunger>18&&!fed){const k=first('kitchen')||first('granary')||[S.cx,S.cy];return setTask(v,'eatout',k[0],k[1],30,{ring:1.25})}
  if(h>=17.3&&h<19&&v.hunger>18&&!fed){if(isFest())return setTask(v,'eatout',S.cx,S.cy,30,{ring:1.7});if(ht)return setTask(v,'eat',ht[0],ht[1],30,{home:1})}
  if(weddingToday()&&h>=15&&h<17&&v.age>=3){const w=S.wedding,left=Math.max(10,(17-h)*60);if(v.id===w.a||v.id===w.b)return setTask(v,'wed',S.cx,S.cy,left,{ring:1.1});if(R()<0.85)return setTask(v,'guest',S.cx,S.cy,left,{ring:1.6+R()*0.6})}
  if(isFest()&&h>=17.5&&v.age>=3) return setTask(v,R()<0.55?'dance':'fire',S.cx,S.cy,ri(35,60),{ring:1.3+R()*0.7});
  if(S.rain>0&&ht&&!(worker&&workHour(h)))return setTask(v,'shelter',ht[0],ht[1],Math.min(S.rain,90),{home:1});
  const tc=teacher(),school=S.school&&tc&&!isMarket()&&h>=8&&h<10.5;
  if(school&&kid&&v.age>=6){const k=S.vills.filter(u=>u.age>=6&&u.age<14).indexOf(v);return setTask(v,'learn',S.school[0],S.school[1],Math.max(10,(10.5-h)*60),{off:[-0.75+(k%4)*0.5,0.45+Math.floor(k/4)*0.45],face:[0,-1]})}
  if(school&&tc===v&&S.vills.some(u=>u.age>=6&&u.age<14))return setTask(v,'teach',S.school[0],S.school[1],Math.max(10,(10.5-h)*60),{off:[0,-0.55],face:[0,1]});
  if(isMarket()&&h>=8&&h<12&&S.stalls&&S.stalls.length&&v.age>=3&&(!worker||!workHour(h)||R()<0.3)){const s=pick(S.stalls);return setTask(v,'market',s[0],s[1],ri(25,45),{jit:1})}
  if(worker&&workHour(h)&&R()<({sieng:0.02,ham:0.16,mo:0.1}[v.trait]||0.05))return leisure(v,h);
  if(worker&&workHour(h)){const r=workTask(v);if(r)return r}
  return leisure(v,h);
}
function deliverPlan(v){
  const c=v.carry.k;

  if(c==='basket'){const k=first('kitchen');if(k)return plan(v,[{t:'cook',at:k,dur:60}]);S.food+=v.carry.n;v.carry=null;return null}
  if(c==='fish'){const ht=homeTile(v);if(ht)return plan(v,[{t:'rack',at:ht,dur:8}])}

function workTask(v){
  const site=findAll('site').length>0,h=hourF();
  switch(v.job){
    case 'farmer': return farmTask(v);
    case 'fisher': return fishPlan(v)||shoreFish(v);
    case 'wood': return lifeWork(v,h)||(site&&h>=13&&R()<0.55&&buildPlan(v))||chopPlan(v)||chores(v);

function godPlace(k,x,y){

function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,(typeof OPT!=='undefined'&&OPT.eco)?1.5:2);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
window.addEventListener('resize',resize);
function toWorld(cx,cy){const r=cv.getBoundingClientRect();return[(cx-r.left-W/2)/zoom+camX,(cy-r.top-H/2)/zoom+camY]}
function screenToTile(px,py){const wx=(px-W/2)/zoom+camX,wy=(py-H/2)/zoom+camY;const a=(wx/HTW+wy/HTH)/2,b=(wy/HTH-wx/HTW)/2;return unrotP(clamp(a,0,N-1),clamp(b,0,N-1))}
const TALL={house:48,granary:46,temple:44,tree:48,site:30,well:36,rock:16,kitchen:40,windmill:70,kiln:30,dinh:50,harbor:24,lighthouse:84};
function pickAt(cx,cy){
  const[wx,wy]=toWorld(cx,cy);
  let bv=null,bd=1e9;
  for(const v of S.vills){
    if(v.inside||v.age<3)continue;
    const[X,Y]=W3(v.x,v.y,v.onBoat?WL:0),s=v.age<8?.62:v.age<14?.8:1,rr=v.onBoat?14:8*s;
    if(Math.abs(wx-X)<=rr&&wy<=Y+4&&wy>=Y-24*s){const d=Math.abs(wx-X)+Math.abs(wy-(Y-10*s));if(d<bd){bd=d;bv=v}}
  }
  if(bv)return{v:bv};
  const a=(wx/HTW+wy/HTH)/2,b=(wy/HTH-wx/HTW)/2,rx=Math.round(a),ry=Math.round(b);
  for(let k=2;k>=1;k--){const tx=rx+k,ty=ry+k;if(tx>=N||ty>=N||tx<0||ty<0)continue;const[x,y]=unrotP(tx,ty),o=S.objs[idx(x,y)];if(!o||!TALL[o.k])continue;const[X,Y]=P3(tx,ty,0);if(Math.abs(wx-X)<22&&wy<Y&&wy>Y-TALL[o.k])return{t:[x,y]}}
  if(rx<0||ry<0||rx>=N||ry>=N)return null;
  return{t:unrotP(rx,ry)};
}
function tap(cx,cy){
  hideSpd();
  if(!tray.hidden){setTray(false);return}
  if(tool==='move'){moveTap(pickAt(cx,cy));return}
  const hit=pickAt(cx,cy);
  if(tool==='select'){
    if(!hit||!hit.v){const pt=petAt(cx,cy);if(pt){openPetNamer(pt);return}}
    if(!hit){selected=null;follow=false;closePanel();return}
    if(hit.v){selectV(hit.v.id);return}
    const i=idx(hit.t[0],hit.t[1]);
    if(S.objs[i]||S.tiles[i].t==='field'){selected={kind:'t',i};follow=false;panel.hidden=false;panel.dataset.kind='t';renderTPanel(i)}
    else{selected=null;follow=false;closePanel()}
    return;
  }
  if(!hit)return;
  let x,y;if(hit.v){x=Math.round(hit.v.x);y=Math.round(hit.v.y)}else[x,y]=hit.t;
  if(tool==='person')godPerson(x,y);else if(tool==='bolt')godBolt(x,y);else if(tool==='erase')godErase(x,y);else godPlace(tool,x,y);
  checkWishes();updHud();
}

function migrate(o){
  if(o.v===3){
    o.v=4;o.trust=25;o.trustTotal=0;o.level=0;o.miles={};o.wishes=[];o.pots=0;o.lastRain=-999;
    o.seasonOff=(4-Math.floor(Math.floor(o.time/DAYM)/5)%4)%4;o.lastSeason=0;

    for(const v of o.vills){
      const L=v.sex==='m'?MALE:FEMALE;let nn=L.find(n=>!used.has(n)&&R()<0.25)||L.find(n=>!used.has(n))||nameOf(v);used.add(nn);v.name=nn;
      if(!v.trait)v.trait=pick(Object.keys(TRAITS));if(!v.look)v.look=genLook(v);v.blessedAt=-1;v.restedAt=-1;
    }

function fmtAway(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);if(h>=24){const d=Math.floor(h/24);return d+' ngày '+(h%24)+' giờ'}return h?h+' giờ '+m+' phút':m?m+' phút':Math.round(sec)+' giây'}
const overEl=document.getElementById('over'),card=document.getElementById('overCard');
function catchup(sec,onDone){
  if(catching)return;
  const want=sec/60*TIME_CFG.awayRate,total=Math.min(want,TIME_CFG.awayMaxDays*DAYM);
  if(total<180){fast=true;let r=total;while(r>0){const s=Math.min(2,r);step(s);r-=s}fast=false;onDone&&onDone();return}
  catching=true;fast=true;
  const before=Object.assign({},S.st),h0=findAll('house').length,d0=S.time,tr0=S.trustTotal||0,lv0=S.level;
  const el=document.getElementById('note');clearTimeout(noteT);el.classList.add('on');
  let dm=0;
  (function chunk(){
    const t0=performance.now();
    while(dm<total&&performance.now()-t0<28){const s=Math.min(3,total-dm);step(s);dm+=s}
    el.textContent='Bạn vắng '+fmtAway(sec)+'. Làng đang sống tiếp… '+Math.round(dm/total*100)+'%';
    if(dm<total){requestAnimationFrame(chunk);return}
    fast=false;catching=false;updHud();save();syncSheep();syncPets();
    const st=S.st,bits=[],days=(S.time-d0)/DAYM,df=k=>(st[k]||0)-(before[k]||0);
    bits.push('làng sống thêm '+(days>=1?days.toFixed(1)+' ngày':Math.round(days*24)+' giờ'));
    if(df('born'))bits.push(df('born')+' em bé');if(df('wed'))bits.push(df('wed')+' đám cưới');
    const nh=findAll('house').length-h0;if(nh>0)bits.push(nh+' nhà mới');
    if(df('events'))bits.push(df('events')+' chuyện lạ');if(df('islands'))bits.push('thấy '+df('islands')+' đảo mới');if(df('discover'))bits.push(df('discover')+' phát hiện bí ẩn');if(df('dreams'))bits.push(df('dreams')+' giấc mơ thành thật');
    bits.push('+'+Math.floor((S.trustTotal||0)-tr0)+' lòng tin');
    noteBusy=false;el.classList.remove('on');
    notify('Trong lúc bạn vắng: '+bits.join(', ')+'.');
    if(S.level>lv0)notify('Làng đã lớn lên thành '+LEVELS[S.level].n+'!');
    notify('Bấm nút ngôi nhà để đọc biên niên sử những chuyện đã xảy ra.');
    onDone&&onDone();
  })();
}

function wishText(w){const W=WISH[w.kind];return typeof W.text==='function'?W.text(w):W.text}
function wishHint(w){const v=getV(w.vid);if(!v)return '';return w.kind==='build'?WISH.build.hint(w):WISH[w.kind].hint(v)}
function wishCard(v){const w=S.wishes&&S.wishes.find(x=>x.vid===v.id);return w?'<div class="wish"><p>Điều ước: “'+esc(wishText(w))+'”</p><small>'+esc(wishHint(w))+' · +'+w.rw+' lòng tin</small><div class="acts">'+wishActs(w)+'</div></div>':''}
function genWishes(){
  S.wishes=(S.wishes||[]).filter(w=>S.time-w.made<DAYM*2&&getV(w.vid));
  const want=2+(S.level>=2?1:0);let made=0,tries=0;
  while(S.wishes.length<want&&tries++<40){
    const c=S.vills.filter(v=>v.age>=6&&!S.wishes.some(w=>w.vid===v.id));if(!c.length)break;
    const v=pick(c),kinds=Object.keys(WISH).filter(k=>WISH[k].ok(v)&&!S.wishes.some(w=>w.kind===k&&['rain','temple','build','friend','house'].includes(k)));
    if(!kinds.length)continue;
    const k=pick(kinds),W=WISH[k];
    S.wishes.push({id:(S.wid=(S.wid||0)+1),vid:v.id,kind:k,made:S.time,base:W.base(v),data:W.data?W.data():null,rw:ri(6,12)});made++;
  }
  if(made&&!fast)notify('Sáng nay có '+made+' người nhờ bạn một điều ước. Chạm ngôi sao để xem.');
}
function checkWishes(){
  if(!S||!S.wishes)return;
  for(const w of S.wishes.slice()){
    const v=getV(w.vid);
    if(!v){S.wishes.splice(S.wishes.indexOf(w),1);continue}
    let ok=false;try{ok=WISH[w.kind].done(w,v)}catch(e){}
    if(ok){
      S.wishes.splice(S.wishes.indexOf(w),1);
      S.st.wishes=(S.st.wishes||0)+1;v.happy=Math.min(100,v.happy+20);addTrust(w.rw);bub(v,'heart',90);
      log(nameOf(v)+' mừng lắm vì điều ước đã thành: “'+wishText(w)+'” +'+w.rw+' lòng tin.');
      if(!fast){sparkle(v.x,v.y,18);sfxChime();notify(nameOf(v)+': “Cảm ơn thần linh!”  +'+w.rw+' lòng tin')}
    }else if(S.time-w.made>DAYM*2)S.wishes.splice(S.wishes.indexOf(w),1);
  }
}
function checkMiles(silent){
  S.miles=S.miles||{};
  for(const[id,name,test,rw] of MILES){
    if(S.miles[id])continue;
    let ok=false;try{ok=test()}catch(e){}
    if(ok){S.miles[id]=dayN();if(rw)addTrust(rw);log('Cột mốc mới: '+name+(rw?' · +'+rw+' lòng tin':''),!silent);if(!silent&&!fast)sfxChime()}
  }
}

function checkLevel(){

let TAGS=[];
function drawTagsNoOverlap(){if(!TAGS.length)return;ctx.font='800 6.5px Nunito, sans-serif';TAGS.sort((a,b)=>b.Y-a.Y||a.id-b.id);const pl=[];
  for(const t of TAGS){const w=ctx.measureText(t.n).width+6;let y=t.Y;const x0=t.X-w/2,x1=t.X+w/2;

function drawHead(v,hx,front,hair){

  if(st===3&&v.age>=6)for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(hx+(front?-3.6:0),-14.6+k*2.4,1.15,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle=v.skin;ctx.beginPath();ctx.arc(hx,-18.2,3.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=hair;
  if(front){
    if(st===4){ctx.beginPath();ctx.arc(hx-2.8,-17.8,1.6,0,Math.PI*2);ctx.fill()}
    else{ctx.beginPath();ctx.arc(hx-.7,-19.2,3.7,Math.PI*0.85,Math.PI*2.05);ctx.fill()}
    if(st===1){ctx.beginPath();ctx.arc(hx-2.6,-21.4,2,0,Math.PI*2);ctx.fill()}

    ctx.fillStyle='rgba(225,120,110,.35)';ctx.beginPath();ctx.arc(hx+1.8,-16.6,.9,0,Math.PI*2);ctx.fill();
    if(L.beard&&v.age>=22){ctx.fillStyle=v.age>=60?'#e7e1dc':hair;ctx.beginPath();ctx.moveTo(hx-1.6,-16.6);ctx.quadraticCurveTo(hx+1,-12.4,hx+3.5,-16.3);ctx.lineTo(hx+2.3,-15.7);ctx.quadraticCurveTo(hx+1,-14.6,hx-.4,-16.1);ctx.fill()}

  if(hat===1){poly(ctx,'#e3c47a',[hx-6.5,-20.3,hx+6.5,-20.3,hx,-25.5]);poly(ctx,'#cfae62',[hx,-25.5,hx+6.5,-20.3,hx+1,-20.3]);ctx.fillStyle='#b8984f';ctx.fillRect(hx-6.5,-20.6,13,.8)}
  else if(hat===2){ctx.fillStyle=hc;ctx.fillRect(hx-3.8,-20.7,7.6,1.8);if(front){ctx.beginPath();ctx.arc(hx-3.9,-19.7,1.05,0,Math.PI*2);ctx.fill()}}
  else if(hat===3){ctx.fillStyle=hc;ctx.beginPath();ctx.ellipse(hx,-20.2,4,3,0,Math.PI,0);ctx.fill();ctx.fillRect(hx-4.4,-20.5,8.8,1)}
}

const DCOST=new Float32Array(N*N),HI=new Int32Array(N*N*8),HD=new Float32Array(N*N*8);
function findPath(sx,sy,gx,gy){
  sx=clamp(Math.round(sx),0,N-1);sy=clamp(Math.round(sy),0,N-1);gx=Math.round(gx);gy=Math.round(gy);
  gm.fill(0);let any=false;
  if(walk(gx,gy)){gm[idx(gx,gy)]=1;any=true}
  else for(const[dx,dy] of DIRS)if(walk(gx+dx,gy+dy)){gm[idx(gx+dx,gy+dy)]=1;any=true}
  if(!any)return null;
  const s=idx(sx,sy);if(gm[s])return[];
  DCOST.fill(1e9);prevA.fill(-1);DCOST[s]=0;prevA[s]=s;let n=0;
  const push=(i,d)=>{let k=n++;while(k>0){const p=(k-1)>>1;if(HD[p]<=d)break;HI[k]=HI[p];HD[k]=HD[p];k=p}HI[k]=i;HD[k]=d};
  const pop=()=>{const top=HI[0];n--;if(n>0){const li=HI[n],ld=HD[n];let k=0;for(;;){let c=2*k+1;if(c>=n)break;if(c+1<n&&HD[c+1]<HD[c])c++;if(HD[c]>=ld)break;HI[k]=HI[c];HD[k]=HD[c];k=c}HI[k]=li;HD[k]=ld}return top};
  push(s,0);
  while(n>0){
    const d0=HD[0],c=pop();if(d0>DCOST[c])continue;
    if(gm[c]){const p=[];let k=c;while(k!==s){p.push(xy(k));k=prevA[k]}return p.reverse()}
    const cx=ix(c),cy=iy(c);
    for(const[dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(!walk(nx,ny))continue;if(dx&&dy&&(!walk(cx+dx,cy)||!walk(cx,cy+dy)))continue;
      const ni=idx(nx,ny),t=S.tiles[ni];let st=(dx&&dy)?1.414:1;
      if(t.t==='field'&&!gm[ni])st+=6;else if(t.road)st*=0.55;
      if(dx&&dy&&(S.tiles[idx(cx+dx,cy)].t==='field'||S.tiles[idx(cx,cy+dy)].t==='field'))st+=1;
      const nd=d0+st;if(nd<DCOST[ni]&&n<HI.length-1){DCOST[ni]=nd;prevA[ni]=c;push(ni,nd)}}
  }
  return null;
}

function b64FromBytes(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}

}
async function parseCode(text){
  text=String(text||'').trim();let json;
  if(text.startsWith('LANGCO1:')){if(typeof DecompressionStream==='undefined')throw new Error('nogzip');json=new TextDecoder().decode(await streamBytes(bytesFromB64(text.slice(8)),new DecompressionStream('gzip')))}

  else if(text.startsWith('{'))json=text;
  else throw new Error('bad');
  const o=JSON.parse(json);if(!validSave(o))throw new Error('invalid');return o;
}

async function cloudInit(){
  try{
    for(let k=0;k<60&&(catching||!started);k++)await new Promise(r=>setTimeout(r,500));
    const C=window.claude;if(!C||!C.use)return;
    const [db,user]=await Promise.all([C.use('db'),C.use('user')]);if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    CLOUD.ref=db.doc('data/users/'+uid+'/langco');
    let snap;try{snap=await CLOUD.ref.get()}catch(e){CLOUD.state='err';CLOUD.err=e&&e.code||'';return}
    CLOUD.state='on';
    if(!snap.exists){CLOUD.ready=true;await cloudPush(true);return}
    const d=snap.data()||{};CLOUD.remote=d;
    if(FRESH&&d.code){await cloudUse(true);return}
    /* cùng "đời" với bản trên mây thì lưu tiếp; khác đời (máy khác đã chơi tiếp) thì hỏi */
    if(!d.code||d.rev===S.cloudRev){CLOUD.ready=true;await cloudPush(true);return}
    CLOUD.hold=true;updTopPills();
    notify('☁️ Trên mây có bản làng mới hơn (ngày '+(d.day||'?')+'). Chạm nút ☁️ để chọn.');
  }catch(e){CLOUD.state='err'}
}
async function cloudPush(force){
  if(!CLOUD.ref||!CLOUD.ready||CLOUD.busy||CLOUD.hold||noSave)return false;
  if(!force&&CLOUD.pushedAt===S.lastSavedAt)return true;
  CLOUD.busy=true;
  try{
    const snap=await CLOUD.ref.get();const cur=snap.exists?(snap.data()||{}):null;
    if(cur&&cur.code&&cur.rev!==S.cloudRev){CLOUD.remote=cur;CLOUD.hold=true;updTopPills();notify('☁️ Làng vừa được chơi tiếp trên máy khác. Chạm nút ☁️ để chọn bản.');return false}
    const rev=((cur&&cur.rev)||0)+1,prevRev=S.cloudRev;S.cloudRev=rev;
    const code=await exportCode();
    if(code.length>240000){S.cloudRev=prevRev;CLOUD.state='err';CLOUD.err='big';return false}
    const m=villageMeta(S);
    try{await CLOUD.ref.set({code,rev,savedAt:Date.now(),day:m.day,pop:m.pop,name:m.name,N:S.N||N,v:S.v})}catch(e){S.cloudRev=prevRev;throw e}
    save();
    CLOUD.pushedAt=S.lastSavedAt;CLOUD.at=Date.now();CLOUD.state='on';CLOUD.err='';return true;
  }catch(e){CLOUD.state='err';CLOUD.err=e&&e.code||'';return false}
  finally{CLOUD.busy=false}
}

    else if(speed>0){let gm=Math.min(dt,0.25)*MPS*speed;while(gm>0){const s=Math.min(gm,speed>=10?2.5:1);step(s);gm-=s}}

}

  try{islandsCompute()}catch(e){console.error(e)}
  fast=true;checkMiles(true);fast=false;
  resize();
  if(fromHot&&typeof data.rot==='number'){rot=data.rot;zoom=data.zoom||1;camX=data.camX;camY=data.camY}
  else{zoom=W<700?0.95:1.35;centerCam()}
  syncSheep();syncPets();initAmbient();groundDirty=true;updHud();
  document.getElementById('musBtn').classList.toggle('off',!AU.on);
  lastF=performance.now();requestAnimationFrame(frame);
  overEl.hidden=true;started=true;

  const away=saved?(Date.now()-(S.savedAt||Date.now()))/1000:0;
  const news=()=>{if(S._new5){delete S._new5;notify('Thế giới vừa rộng ra: phía xa có những hòn đảo phủ sương chờ dân làng khám phá.');notify('Mỗi người giờ có giấc mơ, sở thích, bạn thân và nhật ký riêng. Chạm vào ai đó để đọc.')}};
  if(away>10)catchup(away,news);
  else if(!saved){notify('Chào mừng tới Làng Cổ. Chạm vào ai đó để làm quen.');notify('Chạm đồng hồ để đổi giờ, đổi mùa. Ngôi sao là điều ước của dân làng.')}
  else{notify('Chào mừng bạn quay lại làng.');news()}
}
window.claude?.hot?.snapshot?.(()=>({S:JSON.stringify(S),rot,zoom,camX,camY}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
